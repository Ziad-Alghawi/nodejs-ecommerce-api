# Render Blueprint: one free web service.
# The database is a free MongoDB Atlas M0 cluster, paste its URI as DB_URI.
services:
  - type: web
    name: nodejs-ecommerce-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_TIME
        value: 90d
      - key: JWT_SECRET_KEY
        generateValue: true
      # Asked once when the Blueprint is created
      - key: DB_URI
        sync: false
      - key: STRIPE_SECRET # test mode key (sk_test_...)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # EMAIL_* is left out on purpose: Render Free blocks SMTP ports.
      # BASE_URI is not needed: the app falls back to RENDER_EXTERNAL_URL.
